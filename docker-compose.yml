version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fence_api
      POSTGRES_USER: fence_api
      POSTGRES_PASSWORD: fence_api
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fence_api -d fence_api"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://fence_api:fence_api@db:5432/fence_api
      JWT_SECRET: change_me
      JWT_ALGORITHM: HS256
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
